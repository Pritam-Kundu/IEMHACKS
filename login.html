<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduSmart</title>
    <meta name="description" content="Login to EduSmart platform.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
    
    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <h2>Welcome Back!</h2>
                <p>Login to continue</p>
            </div>

            <div class="role-selection">
                <!-- Student Role -->
                <a href="#" class="role-card">
                    <img src="assets/images/student.png" alt="Student Avatar" class="role-img">
                    <span class="role-name">Student</span>
                </a>
                
                <!-- Teacher Role -->
                <a href="#" class="role-card">
                    <img src="assets/images/teacher.png" alt="Teacher Avatar" class="role-img">
                    <span class="role-name">Teacher</span>
                </a>
                
                <!-- Parent Role -->
                <a href="#" class="role-card">
                    <img src="assets/images/parent.png" alt="Parent Avatar" class="role-img">
                    <span class="role-name">Parent</span>
                </a>
            </div>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="sso-buttons">
                <a href="#" class="btn btn-outline sso-btn">
                    <img src="https://img.icons8.com/color/24/000000/google-logo.png" alt="Google">
                    Google
                </a>
                <a href="#" class="btn btn-outline sso-btn">
                    <i class="fa-solid fa-envelope" style="color: var(--primary-color);"></i>
                    Email
                </a>
            </div>

            <div class="login-footer">
                <p>Don't have an account? <a href="signup.html" class="text-primary">Sign up</a></p>
            </div>
            
        </div>
    </div>

</body>
</html>
